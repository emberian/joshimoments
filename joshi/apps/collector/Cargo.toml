[package]
name = "joshi-collector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bs58 = "0.5.1"
bytes = "1.12.1"
clap.workspace = true
base64.workspace = true
futures-util = { version = "0.3.34", features = ["sink"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
joshi-admission = { path = "../../crates/joshi-admission", features = ["source-edges"] }
joshi-domain = { path = "../../crates/joshi-domain" }
joshi-evidence = { path = "../../crates/joshi-evidence" }
joshi-pump-adapter = { path = "../../crates/joshi-pump-adapter" }
joshi-pump-api = { path = "../../crates/joshi-pump-api" }
joshi-sources = { path = "../../crates/joshi-sources" }
joshi-spool = { path = "../../crates/joshi-spool" }
joshi-store = { path = "../../crates/joshi-store" }
joshi-supervisor = { path = "../../crates/joshi-supervisor" }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = "0.10.9"
time.workspace = true
tokio = { workspace = true, features = ["net", "rt", "signal", "time"] }
toml = { version = "0.8.23", default-features = false, features = ["parse"] }
zeroize.workspace = true

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
