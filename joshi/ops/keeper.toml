# JOSHI keeper — the watch set and the politeness budgets.
#
# Ember edits this file; the keeper re-reads it every tick, so edits take effect without a
# restart (a broken edit keeps the last good config and says so in the heartbeat note).
# Relative paths resolve against this file's directory.
#
# v2 note: the watch set below is hand-listed for now; v2 derives the mint list from the coins
# the wallet actually holds, so a new position starts being kept without editing this file.

# Keeper state root. The durable catalog lives at <root>/catalog (single writer: the keeper),
# the heartbeat at <root>/heartbeat.json, the bounded log at <root>/keeper.log.
root = "../state/keeper"

# Owner-only Helius credential, read at each wallet sweep and never rendered anywhere.
key_file = "~/.helius-key"

# The coin-communities SHARED product key (x-api-key), read at each community tap and never
# rendered anywhere. NOT a credential of Ember's: the pump.fun app bundle ships this same key to
# every visitor on earth, it identifies the product rather than a person, and it rotates with
# app deployments. When the community taps start failing 401, re-extract it:
#   grep -o 'cc_[0-9a-f]\{64\}' <a fresh copy of the app's early bundle chunks>  > this file
# What those requests send to api.coin-communities.xyz (a NEW third party): the mint asked
# about (a public chain fact), this shared key, our IP and user agent. No wallet, no session —
# the same exposure class as swap-api.
community_key_file = "~/.coin-communities-key"

[budgets]
# Hard ceilings the keeper enforces on itself. When the day budget is spent it idles until UTC
# midnight and writes that down durably; nothing here is a hint.
#
# The arithmetic these numbers rest on, so a future edit can redo it instead of trusting it:
# a fully coincident cycle is wallet (1 signatures page + 3 transactions = 4) + candles x2 +
# trades x2 + coin_exact x2 + community_callouts x2 + discovery x1 + movers x1 = 14 requests.
# That coincidence is the schedule, not an accident — every cadence below divides 30 minutes —
# so the cycle ceiling affords it rather than deferring taps into gap-noise every half hour.
# Steady state per day: wallet 48x4=192, candles 2x144=288, trades 2x288=576,
# coin_exact 2x144=288, community_callouts 2x48=96, discovery 288, movers 288 — 2016 in all,
# about 1.4 requests per minute. Only the 192 wallet requests touch the Helius credential; every
# pump read is an anonymous product-route GET (the community reads add the shared bundle key,
# which identifies nobody).
#
# The hot lane ([hot] below) adds on top of that: the worst coincident cycle is three freshly
# leased hot mints each wanting candles + trades + coin_exact + callout_top +
# community_callouts in the same cycle, 3x5 = 15 requests, so 14 + 15 = 29 and the ceiling is
# 30. Per day, one fully hot mint costs 30 candles + 30 trades + 2 coin_exact + 2 callout_top +
# 6 community_callouts = 70 requests per hour, so the 3500 cap affords base 2016 + about 21
# hot-mint-hours (1484/70) — seven hours of triple-hot attention, the same affordance the old
# 3000 cap bought before the movers and community taps existed — at a worst case of ~2.4
# requests per minute. Hotness needs a fresh act every 30 minutes, so sustained worst case
# means Ember is actually sitting there refreshing it. The day cap stays an absolute stop: a
# tap that would bust it defers with a durable note and the keeper idles until UTC midnight,
# exactly as before.
per_cycle_requests = 30
per_day_requests = 3500
# Scheduler granularity; taps fire on their own cadences, this is only how often they are checked.
tick_seconds = 30
# Rate-limit backoff: doubles from the initial on consecutive throttled cycles, capped.
backoff_initial_seconds = 120
backoff_max_seconds = 3600

[wallet]
# The wallet sweep: one signatures page per cadence, hydrating only signatures not yet swept.
address = "Funv3QdbBA1ZUC53t2ZoWa9zubAz15w9oCyajDPoRaMQ"
cadence_minutes = 30
signature_limit = 10
transactions = 3

[taps]
# Reviewed-schema artifacts gate what the pump taps may trust; without a matching review the
# bytes are still retained but quarantined. These live in the repo beside their measurements.
candles_review = "../crates/joshi-pump-api/fixtures/schema_review_candles_v1.json"
trades_review = "../crates/joshi-pump-api/fixtures/schema_review_trades_v1.json"
# coin_exact carries a coin's name, symbol and market caps — plural on purpose: the provider
# asserts TWO market caps per coin (market_cap_usd and usd_market_cap) and they disagree on
# every document measured; both are retained verbatim as claims and nothing anywhere reconciles
# or averages them. The gate is a ROW projection (the document is the single row): the earlier
# whole-document fingerprint pinned one bonding coin's exact field set and refused BOTH watched
# coins live on 2026-08-24, because graduated coins carry fields (inverted, pump_swap_pool,
# website, banner_uri) that coin did not — the digest reported which coin arrived, not provider
# drift. The projection requires what the normalizer reads and closes everything else reviewed;
# an unreviewed leaf still quarantines the document, and the bytes still land either way.
coin_exact_review = "../crates/joshi-pump-api/fixtures/row_projection_coin_exact_v1.json"
# discovery is a ROW-projection review, not a document fingerprint, because /coins pages carry
# heterogeneous rows: every row must show the reviewed required leaves and nothing outside the
# closed reviewed set, or the whole page quarantines with its reason named.
discovery_review = "../crates/joshi-pump-api/fixtures/row_projection_discovery_coins_v1.json"
# callout_top is the hot lane's fourth read: who called a hot coin out, at what multiple, as the
# provider retrospectively scores it. Row-projection review (v2, 2026-08-23, 80-mint sweep);
# an empty page ({"callouts":[]}) is refused as row-uncheckable and retained as an absent
# record, never as evidence that nobody called the coin.
callout_top_review = "../crates/joshi-pump-api/fixtures/row_projection_callout_top_v1.json"
# movers is a ROW-projection review like discovery: heterogeneous compact-key rows. The review
# draws the decoded-vs-inferred line — the volume family the board exists for is inferred from
# key names, decoded by nothing in the app, and every extracted value's tag says so.
movers_review = "../crates/joshi-pump-api/fixtures/row_projection_board_movers_v1.json"
# community_callouts carries the counters Ember actually sees in the app — likes, replies,
# follower counts, spam flags, mentions — from the separate coin-communities service. Reviewed
# 2026-08-24 over 154 rows / two mints; clocks there are ISO-8601 with microseconds while the
# frontend-api callout routes use epoch millis, and the review + normalizer tags keep the two
# from ever being joined silently.
community_callouts_review = "../crates/joshi-pump-api/fixtures/row_projection_community_callouts_v1.json"
# One newest-anchored 1s candle window per tap; 1000 bars of 1s tape is ~16 minutes on a coin
# that trades every second, comfortably overlapping a 10-minute cadence.
candles_interval = "1s"
candles_limit = 1000
# The trades route caps limit at 100.
trades_limit = 100

[hot]
# The hot-attention lane. When Ember focuses in on a coin — holds it (;), requests hot scope,
# or enters the inspect lens (') on it — core writes the coin's mint into <root>/hot-requests.json
# (contract joshi.attention.hot_requests.v1; core is the single writer, this keeper the single
# reader, and neither imports the other). The keeper re-reads that file every tick like this
# config: a hot mint gets candles (1s bars, currency=SOL restated on the retained request —
# the only durable unit statement the price derivation accepts), trades, one coin_exact and one
# callout_top read on the cadences below, while its 30-minute TTL lives; any further act
# refreshes the TTL. Expiry is a silent stop with a log/heartbeat note, never an error. A
# malformed file keeps the last good entries with a note, exactly like a broken config edit.
# The concurrency bound holds hard: slots go to the freshest expiries (the most recently
# refreshed attention), the rest are refused-and-noted durably — oldest expiry is first out.
max_concurrent_mints = 3
candles_cadence_minutes = 2
trades_cadence_minutes = 2
# One coin record and one callout read per 30-minute lease: cadence equals TTL on purpose.
coin_exact_cadence_minutes = 30
callout_top_cadence_minutes = 30
# POLL OR LOSE: the community route is a fixed newest-50 window — limit inert, no pagination,
# history beyond the window unreachable (measured 2026-08-24) — so whatever this cadence misses
# between reads is gone if 50 rows roll over. At 10 minutes a hot coin gets three reads per
# lease and would have to print 50 callouts in 10 minutes (the busiest coin measured did 50 in
# ~two days) to lose one. Faster would fight the provider's GLOBAL shared budget (~1 req/s for
# every pump.fun visitor together; 429s are ordinary) for no realistic coverage gain.
community_callouts_cadence_minutes = 10

[discovery]
# The catalog-level sweep that lets NEW coins reach the attention feed at all: one page of
# /coins?sort=last_trade_timestamp&order=DESC&limit=70&offset=0 per cadence, the exact ask the
# candidate finder proved out. The provider silently clamps limit to 70, so the keeper asks for
# exactly 70 and retains the ask beside the answer. Every promoted row's mint becomes a durable
# solana.token_mint source event; a refused or empty page is a durable gap, never a silence —
# on this route an empty page is byte-identical to past-the-end, so it is never evidence that
# nothing matched.
cadence_minutes = 5

[movers]
# The second catalog-level sweep, beside discovery: one page of
# advanced-indexer.pump.fun/boards/movers?limit=150 per cadence — the only feed anywhere in the
# catalog carrying per-coin windowed volume (5m/15m/1h/24h, SOL and USD, as undecoded compact
# keys whose tags say the meaning is inferred) plus a provider-stated serverTs. limit is
# honoured to 150 then silently clamps (measured 2026-08-24), so the keeper asks exactly 150
# and retains the ask. The board is a PERSONALISED recommendation feed: position is not rank,
# membership is not a census, and absence from it is never evidence of absence. Every promoted
# row's mint becomes a durable solana.token_mint source event under the keeper's movers source,
# establishment "observed_in_promoted_movers_row" — distinct on purpose from discovery's.
cadence_minutes = 5

[[mints]]
mint = "XkeTXo1125vz5H9svJpGiw4JvLbN8VmMu9cmMvspump"
label = "DREGG"
taps = ["candles", "trades", "coin_exact", "community_callouts"]
candles_cadence_minutes = 10
trades_cadence_minutes = 5
# coin_exact refreshes the coin's own record — name, symbol, both market caps, graduation state.
# Reserve fields in it go stale after graduation (measured: launch constants survive a 97% move),
# which is a fact about the provider the catalog retains, not one the keeper repairs.
coin_exact_cadence_minutes = 10
# The social counters for a held coin: likes/replies/followers/spam flags from the newest-50
# community window. POLL OR LOSE applies here too, but a watched coin's callout rate is orders
# of magnitude below 50-per-half-hour (DREGG's whole window held 4 rows on 2026-08-24), so 30
# minutes keeps the accumulated tape gap-free while spending 48 requests a day per coin against
# the provider's shared global budget.
community_callouts_cadence_minutes = 30

[[mints]]
mint = "GwyWFsDKW9a2ref1EWqdUS7B37Toii433zrAh9Dipump"
label = "SOLVE"
taps = ["candles", "trades", "coin_exact", "community_callouts"]
candles_cadence_minutes = 10
trades_cadence_minutes = 5
coin_exact_cadence_minutes = 10
community_callouts_cadence_minutes = 30
