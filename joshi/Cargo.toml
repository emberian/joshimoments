[workspace]
resolver = "3"
members = [
    "apps/collector",
    "apps/core",
    "apps/g0-harness",
    "crates/*",
]
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
axum = { version = "0.8.8", features = ["http1", "json", "tokio"] }
base64 = "0.22.1"
clap = { version = "4.5.60", features = ["derive"] }
http-body-util = "0.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync"] }
tower = { version = "0.5.3", features = ["limit", "util"] }
tracing = "0.1.44"
zeroize = "1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
overflow-checks = true
lto = "thin"
