[package]
name = "joshi-export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
arrow-array = "59.1.0"
arrow-schema = "59.1.0"
joshi-domain = { path = "../joshi-domain" }
joshi-projection = { path = "../joshi-projection" }
joshi-publication = { path = "../joshi-publication" }
joshi-scientific-memory = { path = "../joshi-scientific-memory" }
parquet = { version = "59.1.0", default-features = false, features = ["arrow", "zstd"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "extra_check"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile = "3.27.0"
thiserror.workspace = true
time.workspace = true

[dev-dependencies]
joshi-admission = { path = "../joshi-admission", features = ["source-edges"] }
joshi-evidence = { path = "../joshi-evidence" }
joshi-store = { path = "../joshi-store" }

[lints]
workspace = true

[[example]]
name = "build_fixture"
path = "examples/build_fixture.rs"

[[example]]
name = "build_operational_fixture"
path = "examples/build_operational_fixture.rs"

[[example]]
name = "build_operational_catalog_fixture"
path = "examples/build_operational_catalog_fixture.rs"

[[example]]
name = "pillar7_estimand"
path = "examples/pillar7_estimand.rs"
