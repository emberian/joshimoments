[project]
name = "joshi-analysis"
version = "0.2.0"
description = "Offline, manifested analysis jobs for Joshi"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
dependencies = [
    "duckdb>=1.4.0,<2",
    "pyarrow>=21.0.0,<26",
]

[project.scripts]
joshi-analysis = "joshi_analysis.cli:entrypoint"

[dependency-groups]
dev = [
    "pytest>=8.4.0,<10",
    "ruff>=0.12.0,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/joshi_analysis"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

# corpus/ holds the build and census scripts for the ten-day bulk_pump corpus. They are
# exploratory and SQL-heavy: their value is that they reproduce the numbers, and wrapping embedded
# SQL to 100 columns makes them harder to read against the queries they encode, not easier.
# E501 (line length), E701/E702 (compound statements) are relaxed there for that reason and no
# other. Everything else still applies, and anything in corpus/ that becomes a reusable instrument
# rather than a one-off probe should be brought up to the full standard -- signature_regimes.py
# already is.
[tool.ruff.lint.per-file-ignores]
"corpus/*.py" = ["E501", "E701", "E702"]
