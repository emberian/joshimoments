# Operator-attested wallet labels — the ground truth no instrument can produce.
#
# HANDOFF.md's process lesson: "measurement was complete and meaningless until a human
# said 'that address is mine' or 'that one is a scammer'. Make it cheap to attach a
# label, and record its confidence alongside it." This file is that mechanism.
#
# Provenance: operator statements in session 6afafeaf (the accounting fork,
# messages ~1866-1878, 2026-08-14) and session 59905ce5. The fork displayed most
# addresses truncated; entries with `address: null` carry the operator's prefix and
# need resolution against the five-wallet counterparty set (see
# studies/position_history.py). DO NOT guess a full address from a prefix — resolve
# it from the ledger or leave it null.
#
# confidence: attested = operator said it outright; probable = operator said
# "pretty sure"; inferred = derived by an instrument, never overrides attested.
#
# ---------------------------------------------------------------------------------
# RESOLUTION RULE (2026-08-15). Read this before adding or changing any address.
# ---------------------------------------------------------------------------------
# An active ADDRESS-POISONING campaign dusts these wallets with lookalikes that match
# BOTH the leading and trailing characters of a real counterparty, within seconds of
# the real payment (measured latencies: 16s, 22s, 31s). Matching a prefix against all
# of chain history therefore resolves to the ATTACKER by construction. The rule used
# here, and the one to keep using:
#
#   Candidate set = counterparties of the five own_wallets ONLY, derived from the
#   on-disk cache .cache/position_history/tx/*.json (2012 transactions,
#   2026-06-27T13:14Z .. 2026-08-14T05:25Z — the wallets' full lifetimes bar the last
#   day) by walking every parsed transfer|transferChecked|transferWithSeed leg and
#   resolving SPL token accounts to owners via that transaction's OWN
#   pre/postTokenBalances. Prefix comparison is CASE-SENSITIVE base58.
#
#   A candidate is the label's referent only if it is SUBSTANTIVE:
#     (a) SOL: >= 0.1 SOL (1e8 lamports) cumulative OUTBOUND from an own wallet, via a
#         bare system transfer in a transaction invoking no swap/LP/fee-claim program; or
#     (b) tokens: an outbound token amount whose exact raw value is NOT shared by more
#         than 10 other recipients (i.e. not a batch airdrop).
#
#   Everything else is an artifact:
#     - inbound-only, <= 0.0001 SOL, or a 0.000001-SOL / zero-value token transfer
#       -> ADDRESS-POISONING DUST;
#     - a token receipt whose exact raw amount recurs across hundreds of recipients
#       (744.046875 DREGG x886, 22778.0 DREGG x77) -> HOLDER AIRDROP, median ~$0.24
#       (studies/RESULT_position_history.md:217).
#
#   The two floors are separated by ~1000x: every confirmed lookalike delivered
#   <= 0.0001 SOL inbound and 0 outbound, while the smallest genuine discretionary
#   payment in the whole book is 0.1 SOL outbound. DIRECTION IS THE DISCRIMINATOR:
#   real payees RECEIVE from us; poisoners SEND dust to us.
#
# Bound on all six prefix questions: the complete set of non-hub SOL payees >= 0.1 SOL
# across all five wallets over the entire history is 16 addresses totalling 66.2959 SOL,
# which reconciles with RESULT_position_history.md:437 ("discretionary distributions
# -66.2993 SOL"). Exactly ONE of those 16 matches any of the six prefixes.

