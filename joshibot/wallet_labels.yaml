#
#   uv run python -c "
#   import yaml; from solders.pubkey import Pubkey
#   d=yaml.safe_load(open('wallet_labels.yaml'))
#   for s in ('own_wallets','external'):
#       for e in d.get(s) or []:
#           a=e.get('address')
#           assert a is None or Pubkey.from_string(a).is_on_curve(), (e.get('label'), a)
#   print('all live addresses on-curve')"
#
# Two of the three full addresses this file inherited were off-curve: an ATTESTED payroll
# address and the relayer. Both were truncated displays completed with a fabricated tail, and
# both were caught by exactly this check. An off-curve key has no private key, so it can
# neither sign nor be paid at -- it is not a wallet, whatever the label says.
